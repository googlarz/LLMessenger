# Builds and runs the full test suite on every push and PR to main.
# The release workflow (release.yml) only fires on tags — without this,
# broken commits ride silently until release time.
#
# Security note: no untrusted event data (titles, bodies, branch names) is
# interpolated into run: blocks anywhere in this workflow.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Production Gates
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Regenerate project from project.yml
        run: xcodegen generate

      - name: Security audit
        run: scripts/security-audit.sh

      - name: Verify test registration
        run: scripts/check-test-registration.sh

      - name: Build & test
        run: |
          set -o pipefail
          xcodebuild \
            -scheme LLMessenger \
            -configuration Debug \
            -project LLMessenger.xcodeproj \
            -parallel-testing-enabled NO \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            OTHER_LDFLAGS="" \
            test 2>&1 | tee test.log | grep -E "Test Suite|Executed|error:" || true
          grep -q "TEST SUCCEEDED" test.log

      - name: Static analysis
        run: |
          set -o pipefail
          xcodebuild \
            -scheme LLMessenger \
            -configuration Release \
            -project LLMessenger.xcodeproj \
            CODE_SIGNING_ALLOWED=NO \
            OTHER_LDFLAGS="" \
            analyze 2>&1 | tee analyze.log

      - name: Lint — no hard-coded colors outside Theme.swift
        run: |
          # Color(red:green:blue:) literals are only allowed in Theme.swift.
          # All other UI files must use Theme.* semantic tokens.
          hits=$(grep -rn 'Color(red:' LLMessenger/ --include="*.swift" \
                   | grep -v 'LLMessenger/UI/Theme.swift' || true)
          if [ -n "$hits" ]; then
            echo "Hard-coded Color(red:) found outside Theme.swift:"
            echo "$hits"
            exit 1
          fi

      - name: Archive unsigned universal app
        run: |
          set -o pipefail
          xcodebuild \
            -scheme LLMessenger \
            -configuration Release \
            -project LLMessenger.xcodeproj \
            -destination 'generic/platform=macOS' \
            -archivePath build/LLMessenger.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            OTHER_LDFLAGS="" \
            archive 2>&1 | tee archive.log

      - name: Verify archived app
        run: scripts/verify-app-bundle.sh build/LLMessenger.xcarchive/Products/Applications/LLMessenger.app

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: |
            test.log
            analyze.log
            archive.log
            TestResults.xcresult
          retention-days: 14
